[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Video upload page
[[redirects]]
  from = "/upload"
  to = "/upload.html"
  status = 200

# Video analysis page
[[redirects]]
  from = "/analysis"
  to = "/analysis.html"
  status = 200

# Student's video analysis report (private link)
[[redirects]]
  from = "/report/*"
  to = "/report.html"
  status = 200

[[headers]]
  for = "/report*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Players' login (WhatsApp code)
[[redirects]]
  from = "/me"
  to = "/me.html"
  status = 200

# Player progress page (private link)
[[redirects]]
  from = "/player/*"
  to = "/player.html"
  status = 200

[[headers]]
  for = "/player*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# GlassWall import (admin)
[[redirects]]
  from = "/admin/glasswall"
  to = "/glasswall.html"
  status = 200

# Report builder (admin)
[[redirects]]
  from = "/admin/report"
  to = "/report-edit.html"
  status = 200

# Private bookings dashboard
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
